# Cloud Build config for deploying the Spring Boot token broker to Cloud Run.
# Intended for a Cloud Build trigger connected to the deployment branch.

substitutions:
  _REGION: europe-west1
  _REPOSITORY: token-broker
  _SERVICE: token-broker
  _FRONTEND_ORIGIN: https://melangoth.github.io
  _CPU: '0.25'
  _MEMORY: 512Mi
  _CONCURRENCY: '1'
  _MAX_INSTANCES: '2'
  _TIMEOUT: 300s

steps:
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - projects/backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - projects/backend

  - id: push-backend-image-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA

  - id: push-backend-image-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --concurrency=${_CONCURRENCY}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=${_TIMEOUT}
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --set-env-vars=APP_CORS_ALLOWED_ORIGINS=${_FRONTEND_ORIGIN},GOOGLE_AUTHORIZATION_ENABLED=true,GOOGLE_AUTHORIZATION_CALLBACK_URL=https://token-broker-cmpyaqfhrq-ew.a.run.app/api/google/authorization/callback,GOOGLE_AUTHORIZATION_POST_AUTH_REDIRECT_URI=https://melangoth.github.io,GOOGLE_AUTHORIZATION_FIRESTORE_COLLECTION=user_google_authorizations,GOOGLE_AUTHORIZATION_SCOPES=openid email profile https://www.googleapis.com/auth/drive.file
      - --set-secrets=GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,JWT_SIGNING_KEY=jwt-signing-key:latest,GOOGLE_AUTHORIZATION_TOKEN_ENCRYPTION_KEY=google-authorization-token-encryption-key:latest

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
