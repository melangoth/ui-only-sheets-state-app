<div class="button-board">
  <div *ngIf="isLoading() || isSaving() || isRefreshing()" class="stitch-alert stitch-alert--info board-status d-flex align-items-center gap-2 mb-3">
    <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
    <span>{{ getStatusMessage() }}</span>
  </div>

  <div *ngIf="errorMessage()" class="stitch-alert stitch-alert--error board-error d-flex justify-content-between align-items-center gap-2 mb-3">
    <span>{{ errorMessage() }}</span>
    <button class="btn btn-sm stitch-btn-secondary" (click)="retryInit()">Retry access</button>
  </div>

  <div *ngIf="boardStatus() === 'ready' || boardStatus() === 'refreshing'" class="d-flex justify-content-end mb-3">
    <button class="btn stitch-btn-secondary board-refresh d-inline-flex align-items-center gap-2" [disabled]="isRefreshing()" (click)="refreshStates()" title="Refresh button states">
      <span *ngIf="isRefreshing()" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span>↻ Force Refresh</span>
    </button>
  </div>

  <div *ngIf="boardStatus() !== 'idle'" class="button-grid">
    <button
      *ngFor="let btn of buttonConfig"
      class="color-tile"
      [style.--tile-color]="btn.backgroundColor"
      [style.--tile-text]="btn.textColor"
      [disabled]="isButtonDisabled(btn.colorKey)"
      (click)="toggleButton(btn)"
    >
      <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
        <span class="tile-icon">🎨</span>
        <span
          class="stitch-pill"
          [class.state-passive]="getState(btn.colorKey)?.labelState === 'Passive'"
          [class.state-active]="getState(btn.colorKey)?.labelState === 'Active'"
        >
          {{ getState(btn.colorKey)?.labelState ?? '...' }}
        </span>
      </div>

      <div>
        <div class="fw-semibold fs-5 lh-sm mb-1">{{ btn.displayName }}</div>
        <div class="small text-secondary">{{ btn.backgroundColor }}</div>
      </div>

      <div *ngIf="isSaving()" class="tile-saving">
        <span class="d-inline-flex align-items-center gap-2">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          Saving...
        </span>
      </div>
    </button>
  </div>
</div>
