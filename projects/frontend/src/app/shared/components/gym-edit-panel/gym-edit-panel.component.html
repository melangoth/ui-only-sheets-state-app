<div *ngIf="editError()" class="stitch-alert stitch-alert--error edit-error small mb-2">{{ editError() }}</div>

<div class="edit-grid">
  <div>
    <label class="form-label small fw-semibold mb-1">Gym name <span class="text-danger">*</span></label>
    <input
      type="text"
      class="stitch-input w-100"
      [ngModel]="editName()"
      (ngModelChange)="editName.set($event)"
      [disabled]="editSaving()"
    />
  </div>

  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      [id]="'editDefended-' + gym.id"
      [ngModel]="editDefended()"
      (ngModelChange)="editDefended.set($event)"
      [disabled]="editSaving()"
    />
    <label class="form-check-label small" [for]="'editDefended-' + gym.id">Currently defended</label>
  </div>

  <div *ngIf="editDefended()">
    <label class="form-label small fw-semibold mb-1">Defender Pokémon</label>
    <input
      type="text"
      class="stitch-input w-100"
      #defenderPokemonInput
      [ngModel]="editDefenderPokemon()"
      (ngModelChange)="editDefenderPokemon.set($event)"
      [disabled]="editSaving()"
      placeholder="e.g. Blissey"
    />
  </div>
</div>

<div class="edit-actions d-flex flex-wrap gap-2 align-items-center">
  <button class="btn btn-sm stitch-btn-primary" (click)="saveEdit()" [disabled]="editSaving()">
    <span *ngIf="editSaving()" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    Save
  </button>
  <button class="btn btn-sm stitch-btn-secondary" (click)="cancel()" [disabled]="editSaving()">Cancel</button>
  <button class="btn btn-sm stitch-btn-danger ms-sm-auto" (click)="requestDelete()" [disabled]="editSaving()" title="Delete">Delete gym</button>
</div>
