<div *ngIf="editError()" class="alert alert-danger py-1 small mb-2">{{ editError() }}</div>

<div class="mb-2">
  <label class="form-label small fw-semibold mb-1">Gym name <span class="text-danger">*</span></label>
  <input
    type="text"
    class="form-control form-control-sm"
    [ngModel]="editName()"
    (ngModelChange)="editName.set($event)"
    [disabled]="editSaving()"
  />
</div>

<div class="form-check mb-2">
  <input
    class="form-check-input"
    type="checkbox"
    [id]="'editDefended-' + gym.id"
    [ngModel]="editDefended()"
    (ngModelChange)="editDefended.set($event)"
    [disabled]="editSaving()"
  />
  <label class="form-check-label small" [for]="'editDefended-' + gym.id">Currently defended</label>
</div>

<div *ngIf="editDefended()" class="mb-2">
  <label class="form-label small fw-semibold mb-1">Defender Pokémon</label>
  <input
    type="text"
    class="form-control form-control-sm"
    [ngModel]="editDefenderPokemon()"
    (ngModelChange)="editDefenderPokemon.set($event)"
    [disabled]="editSaving()"
    placeholder="e.g. Blissey"
  />
</div>

<div class="d-flex gap-2 mt-2">
  <button class="btn btn-success btn-sm" (click)="saveEdit()" [disabled]="editSaving()">
    <span *ngIf="editSaving()" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    Save
  </button>
  <button class="btn btn-outline-secondary btn-sm" (click)="cancel()" [disabled]="editSaving()">Cancel</button>
</div>
