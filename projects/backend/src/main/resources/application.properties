# Google OAuth client ID (same value used by the frontend)
app.google.client-id=${GOOGLE_CLIENT_ID}

# Secret key for signing app JWTs (at least 32 bytes); inject via environment variable or Secret Manager
app.jwt.signing-key=${JWT_SIGNING_KEY}

# App token lifetime in seconds (default: 3600 = 1 hour)
app.jwt.ttl-seconds=3600

# Comma-separated list of allowed frontend origins for CORS
# Example production value: https://your-app.web.app
app.cors.allowed-origins=http://localhost:4200

# Expose only the health endpoint for Cloud Run probes; keep all others private
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Server port (Cloud Run injects PORT at runtime)
server.port=${PORT:8080}

# Backend-owned Google authorization (Plan B2a)
app.google.authorization.enabled=${GOOGLE_AUTHORIZATION_ENABLED:false}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.authorization.callback-url=${GOOGLE_AUTHORIZATION_CALLBACK_URL:http://localhost:8080/api/google/authorization/callback}
app.google.authorization.post-auth-redirect-uri=${GOOGLE_AUTHORIZATION_POST_AUTH_REDIRECT_URI:http://localhost:4200}
app.google.authorization.scopes=${GOOGLE_AUTHORIZATION_SCOPES:openid email profile https://www.googleapis.com/auth/drive.file}
app.google.authorization.firestore.project-id=${GOOGLE_AUTHORIZATION_FIRESTORE_PROJECT_ID:}
app.google.authorization.firestore.collection=${GOOGLE_AUTHORIZATION_FIRESTORE_COLLECTION:user_google_authorizations}
app.google.authorization.token-encryption-key=${GOOGLE_AUTHORIZATION_TOKEN_ENCRYPTION_KEY:}
